[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Zero-dependency security firewall & execution sandbox for autonomous AI agents and LLM tool calls"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Atharva Jadhav", email = "atharva@example.com" }
]
keywords = [
    "ai-agents",
    "llm-security",
    "sandbox",
    "prompt-injection",
    "ai-safety",
    "agentic-workflow",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = []

[project.scripts]
agentguard = "agentguard.cli:main"

[project.urls]
Homepage = "https://github.com/atharvabalujadhav21052007-ux/agent-guard"
Repository = "https://github.com/atharvabalujadhav21052007-ux/agent-guard.git"
Issues = "https://github.com/atharvabalujadhav21052007-ux/agent-guard/issues"
