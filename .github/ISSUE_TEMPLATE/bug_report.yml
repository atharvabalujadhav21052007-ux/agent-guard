name: 🐛 Bug Report
description: Create a report to help us improve AgentGuard
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code or command to reproduce the issue.
      placeholder: |
        agentguard run -- "my-command"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python version, AgentGuard version.
      placeholder: Windows 11 / Ubuntu 22.04, Python 3.12, AgentGuard 0.1.0
    validations:
      required: true
